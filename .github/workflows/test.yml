name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  voice-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The check uses a fake model, so the CPU build of torch is enough and Chatterbox is not needed.
      - run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      # soundfile is what torchaudio writes WAV with on Linux; Chatterbox brings it in a real install.
      - run: pip install fastapi==0.136.1 "uvicorn[standard]==0.46.0" httpx soundfile numpy
      - run: python test_server.py
