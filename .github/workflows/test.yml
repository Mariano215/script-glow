name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  voice-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The check uses a fake model, so the CPU build of torch is enough and Chatterbox is not needed.
      - run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      # soundfile is what torchaudio writes WAV with on Linux; Chatterbox brings it in a real install.
      - run: pip install fastapi==0.136.1 "uvicorn[standard]==0.46.0" httpx soundfile numpy
      - run: python test_server.py

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Unsigned test build: signing belongs to the release workflow.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Playwright drives the app through --inspect, so this test build keeps that fuse on.
      # The release build never sets it (desktop/builder.cjs).
      SCRIPT_GLOW_INSPECTABLE_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:dir
      - run: node verification/desktop.mjs
      # Built-in voices end to end with the real model. The files come from the kokoro-assets-v1
      # release, which Mariano publishes by hand and then marks with the KOKORO_ASSETS_PUBLISHED
      # repository variable; until then these steps are skipped. The files are cached between runs,
      # keyed on the manifest, so a new model file refreshes the cache.
      - name: Cache the built-in voice files
        if: vars.KOKORO_ASSETS_PUBLISHED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sg-home/models
          key: kokoro-${{ hashFiles('server/kokoro/manifest.json') }}
      - name: Built-in voices in the packed app
        if: vars.KOKORO_ASSETS_PUBLISHED == 'true'
        env:
          SCRIPT_GLOW_TEST_HOME: ${{ runner.temp }}/sg-home
          # The release gate is still false, so the packed app offers the voices only with this set.
          SCRIPT_GLOW_EXPERIMENTAL_KOKORO: '1'
        run: node verification/kokoro-desktop.mjs
      - name: The 20 actor lines through the real word lists
        if: vars.KOKORO_ASSETS_PUBLISHED == 'true'
        env:
          G2P_DIR: ${{ runner.temp }}/sg-home/models/kokoro-v1/g2p
        shell: bash
        run: node verification/kokoro-g2p.mjs "$G2P_DIR"
