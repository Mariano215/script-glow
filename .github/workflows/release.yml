name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # electron-builder uploads to v<package.json version>, not to the pushed tag. A tag that
      # does not match would upload nothing and still pass, so it stops the release here.
      - name: Check the tag matches package.json
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" != "$expected" ]]; then
            echo "Error: tag $TAG_NAME does not match the package.json version $expected. Push a tag that matches package.json." >&2
            exit 1
          fi
          echo "Tag $TAG_NAME matches package.json."
      - run: npm ci
      # The built-in voices ship switched on only once the Misaki word lists are confirmed permissive
      # (release gate in docs/superpowers/specs/2026-09-19-kokoro-engine-design.md). Mariano sets the
      # flag. This step only reports: an app release goes ahead either way, with the voices off until then.
      - name: Report the built-in voices release gate
        shell: bash
        run: |
          if [[ "$(node -p "require('./server/kokoro/release-gate.json').misakiProvenanceCleared")" == "true" ]]; then
            line="Built-in voices: ON in this release (server/kokoro/release-gate.json has misakiProvenanceCleared: true)."
          else
            line="Built-in voices: OFF in this release. They wait on the Misaki word-list provenance (server/kokoro/release-gate.json)."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - run: npm test
      - run: npm run build
      - name: Validate signing secrets present
        shell: bash
        env:
          # Mac: Developer ID certificate and notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            missing=""
            [[ -z "$CSC_LINK" ]] && missing="$missing CSC_LINK"
            [[ -z "$CSC_KEY_PASSWORD" ]] && missing="$missing CSC_KEY_PASSWORD"
            [[ -z "$APPLE_ID" ]] && missing="$missing APPLE_ID"
            [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
            [[ -z "$APPLE_TEAM_ID" ]] && missing="$missing APPLE_TEAM_ID"
            if [[ -n "$missing" ]]; then
              echo "Error: Missing Mac signing secrets:$missing" >&2
              exit 1
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # The Azure values are optional as a set: sign with all of them, build unsigned
            # without them. A half-set is named in the log and in the release note, and the
            # build goes on unsigned, because a partly set up account must not block a release.
            azure_names="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE AZURE_PUBLISHER_NAME"
            missing=""
            total=0
            present=0
            for name in $azure_names; do
              total=$((total + 1))
              if [[ -z "${!name}" ]]; then
                missing="$missing $name"
              else
                present=$((present + 1))
              fi
            done
            if [[ "$present" -eq "$total" ]]; then
              echo "All Azure signing values present. This Windows build will be signed."
            elif [[ "$present" -eq 0 ]]; then
              line="This Windows build is not signed. Windows will show a SmartScreen warning."
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            else
              line="This Windows build is not signed. Windows will show a SmartScreen warning. Azure signing is only part set up, these values are missing:$missing"
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Check release not already published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set +e
          output=$(gh release view "$TAG_NAME" --repo "$REPO_NAME" --json isDraft --jq .isDraft 2>&1)
          exit_code=$?
          set -e

          if [[ $exit_code -eq 0 ]]; then
            if [[ "$output" == "true" ]]; then
              echo "Release is a draft, proceeding to publish..."
            else
              echo "Error: Release $TAG_NAME is already published. Aborting to prevent overwriting." >&2
              exit 1
            fi
          elif echo "$output" | grep -q "release not found"; then
            echo "No release found yet, creating a new one..."
          else
            echo "Error checking release status:" >&2
            echo "$output" >&2
            exit 1
          fi
      # Uploads to a draft release. Mariano checks the files and publishes it by hand.
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mac: Developer ID certificate and notarization.
          # Mac only: on Windows electron-builder would sign the installer with this Apple p12.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          # Windows signs through Azure Trusted Signing, so identity discovery stays off there or
          # electron-builder hunts for a certificate the runner does not have. macOS needs it ON:
          # the Developer ID identity lives in the keychain electron-builder builds from CSC_LINK,
          # and with discovery off electron-builder finds no identity, then skips both signing and
          # notarization with only a warning. Evaluates to the string true on macOS, false on Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
        run: npx electron-builder --config desktop/builder.cjs --publish always
      # Tells the person who publishes the draft which files are signed, since the Windows
      # installer is unsigned until the Azure values exist. Runs only on the macOS leg: both
      # matrix jobs finish close together, and two unlocked read-then-write edits of the same
      # release body would race and could overwrite each other's note. The Mac line is always
      # true here because the Apple values are required above; the Windows line is read from
      # the Azure variables, which every job (not just the Windows one) can see.
      - name: Note signing status in the release
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          azure_var_names="AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE AZURE_PUBLISHER_NAME"
          total=0
          present=0
          for name in $azure_var_names; do
            total=$((total + 1))
            [[ -n "${!name}" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq "$total" ]]; then
            windows_line="The Windows installer is signed."
          else
            windows_line="The Windows installer is not signed yet, so Windows shows a SmartScreen warning: choose More info, then Run anyway."
          fi

          marker="### Signing"
          section="$marker"$'\n'"The Mac files are signed and notarized."$'\n'"$windows_line"

          body="$(gh release view "$TAG_NAME" --repo "$REPO_NAME" --json body --jq .body)"
          # A re-run writes the same marker again, so drop everything from the marker onward
          # (the section this step wrote is always last) before appending the fresh section.
          idx="$(grep -bo "$marker" <<<"$body" | head -1 | cut -d: -f1 || true)"
          if [[ -n "$idx" ]]; then
            prefix="${body:0:$idx}"
          else
            prefix="$body"
          fi
          prefix="$(printf '%s' "$prefix" | sed -e 's/[[:space:]]*$//')"

          if [[ -z "$prefix" ]]; then
            new_body="$section"
          else
            new_body="$prefix"$'\n\n'"$section"
          fi

          notes_file="$(mktemp)"
          printf '%s\n' "$new_body" > "$notes_file"
          gh release edit "$TAG_NAME" --repo "$REPO_NAME" --notes-file "$notes_file"
